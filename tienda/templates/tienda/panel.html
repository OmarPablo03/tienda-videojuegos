{% extends 'tienda/base.html' %}

{% block content %}
<h2 class="mb-4">Panel de Control</h2>
<div class="row">
    <div class="col-md-4">
        <div class="card bg-primary text-white p-3 shadow">
            <h5>Total de Videojuegos</h5>
            <h2>{{ total_juegos }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-success text-white p-3 shadow">
            <h5>Unidades en Stock</h5>
            <h2>{{ total_stock }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-danger text-white p-3 shadow">
            <h5>Juegos con Bajo Stock</h5>
            <h2>{{ juegos_bajo_stock }}</h2>
        </div>
    </div>
</div>
{% endblock %}
